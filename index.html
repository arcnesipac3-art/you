<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Flower For You 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff8ee; --pink:#ffb6cf; --rose:#f47aa6; --deep:#d9558a; --lav:#d9c9ff;
  --leaf:#a8dcae; --leaf-d:#6fbf84; --soil:#a77a62; --ink:#5b3a52;
  --bg1:#ffe9f1; --bg2:#efe6ff; --bg3:#fff8ee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#5b3a52}
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
  overflow-x:hidden;-webkit-user-select:none;user-select:none;
}
.page{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:clamp(20px,4vh,40px) 18px clamp(20px,4vh,36px);gap:12px;position:relative;
}
.glow{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none;z-index:0}
.g1{width:55vmin;height:55vmin;background:var(--lav);top:-12vmin;left:-14vmin}
.g2{width:60vmin;height:60vmin;background:var(--pink);bottom:-18vmin;right:-16vmin}
.top{position:relative;z-index:1;text-align:center;max-width:26rem;min-height:5.5rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(1.35rem,5.6vw,2rem);line-height:1.25;margin:0}
.sub{font-size:clamp(.9rem,3.6vw,1.05rem);margin:.5rem 0 0;opacity:.8}
.stage{position:relative;z-index:1;width:min(88vw,360px);flex:1 1 auto;min-height:0;max-height:52vh;display:flex;align-items:flex-end;justify-content:center}
svg.scene{width:100%;height:100%;max-height:52vh;overflow:visible;touch-action:manipulation}
.bottom{position:relative;z-index:1;width:100%;max-width:26rem;text-align:center;min-height:9rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px}
.msg{font-family:'Fraunces',Georgia,serif;font-size:clamp(1rem,4.2vw,1.2rem);line-height:1.45;margin:0;min-height:1.5em}
.msg2{font-size:clamp(.9rem,3.8vw,1.05rem);opacity:0;transition:opacity 1s;margin:0}
.msg2.on{opacity:.85}
.btn{
  font:700 1.05rem 'Nunito',system-ui,sans-serif;color:#fff;border:0;cursor:pointer;
  min-height:52px;padding:0 28px;width:min(100%,19rem);border-radius:999px;
  background:linear-gradient(135deg,#f58bb2,#d9558a);box-shadow:0 10px 24px -8px rgba(217,85,138,.65),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .15s,box-shadow .15s,opacity .5s;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.flower-hit:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.btn[hidden]{display:none}
.fade-in{animation:fade .8s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.secret{font-family:'Fraunces',serif;font-style:italic;color:var(--deep);font-size:clamp(1rem,4.2vw,1.15rem);margin:0;min-height:1.4em}

/* growth */
.seed{transform-origin:180px 372px}
.seed.wiggle{animation:wig .9s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
.stem{stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset 2.4s cubic-bezier(.4,.1,.3,1)}
.grow .stem{stroke-dashoffset:0}
.leaf{transform:scale(0);opacity:0;transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .5s}
.leaf.on{transform:scale(1);opacity:1}
.bloom-wrap{transform-box:fill-box;transform-origin:50% 100%}
.petal{transform-box:fill-box;transform-origin:50% 100%;transition:transform 2.6s cubic-bezier(.3,.9,.3,1)}
.bud{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.bud.on{transform:scale(1)}
.p-back{transform:scale(.55)} .p-left{transform:scale(.6) rotate(0)} .p-right{transform:scale(.6) rotate(0)} .p-front{transform:scale(.62)}
.open .p-back{transform:scale(1)}
.open .p-left{transform:rotate(-28deg) scale(1)}
.open .p-right{transform:rotate(28deg) scale(1)}
.open .p-front{transform:scale(1)}
.center-glow{opacity:0;transition:opacity 2s}
.open .center-glow{opacity:1}
.flower-hit{cursor:pointer;outline:none}
.sway{transform-box:fill-box;transform-origin:50% 100%}
.swaying .sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.poke{animation:poke .45s}
@keyframes poke{40%{transform:scale(1.08) rotate(3deg)}}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.heart{position:absolute;bottom:22%;font-size:14px;opacity:0;animation:rise 4s ease-out forwards;will-change:transform,opacity}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-34vh) translateX(var(--dx)) scale(1.1)}}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}
@media (orientation:landscape) and (max-height:520px){
  .page{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 28px;padding-top:12px;padding-bottom:12px}
  .top,.bottom{flex:1 1 40%;min-height:0}
  .stage{flex:0 0 auto;width:min(40vw,280px);max-height:80vh;order:2;height:80vh}
  .top{order:1} .bottom{order:3;flex-basis:100%;min-height:0;flex-direction:row;flex-wrap:wrap;justify-content:center}
  .page{align-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="page">
  <header class="top" aria-live="polite">
    <h1 id="title">I made something for you 🌱</h1>
  </header>

  <div class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 360 420" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A seed in soil that grows into a pink tulip">
      <defs>
        <radialGradient id="pg" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#ff9cc0"/><stop offset="1" stop-color="#f06a9b"/></radialGradient>
        <radialGradient id="pg2" cx="50%" cy="70%" r="80%"><stop offset="0" stop-color="#ffc7dc"/><stop offset="1" stop-color="#f58bb2"/></radialGradient>
        <radialGradient id="glw"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="soilg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98b72"/><stop offset="1" stop-color="#8d6350"/></linearGradient>
        <linearGradient id="lf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6fbf84"/><stop offset="1" stop-color="#b9e8bb"/></linearGradient>
      </defs>
      <!-- soil -->
      <ellipse cx="180" cy="396" rx="118" ry="20" fill="rgba(120,70,90,.12)"/>
      <path d="M70 380 Q180 350 290 380 Q285 412 180 414 Q75 412 70 380Z" fill="url(#soilg)"/>
      <circle cx="105" cy="388" r="3" fill="#8d6350"/><circle cx="250" cy="392" r="3.5" fill="#8d6350"/><circle cx="215" cy="400" r="2.5" fill="#7a5545"/>
      <!-- seed -->
      <g class="seed" id="seed"><ellipse cx="180" cy="370" rx="9" ry="6.5" fill="#6b4a3a"/><ellipse cx="177" cy="368" rx="3" ry="1.8" fill="#9b7460"/></g>

      <g id="plant" class="sway">
        <path class="stem" id="stem" d="M180 372 C176 330 186 290 180 190" fill="none" stroke="#6fbf84" stroke-width="7" stroke-linecap="round"/>
        <!-- leaves -->
        <g class="leaf" id="leaf1" style="transform-origin:180px 320px;transform-box:view-box"><path d="M181 322 C214 322 240 300 248 268 C214 266 186 288 181 322Z" fill="url(#lf)"/><path d="M184 318 Q215 298 240 274" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" fill="none"/></g>
        <g class="leaf" id="leaf2" style="transform-origin:180px 275px;transform-box:view-box"><path d="M179 276 C146 276 120 254 112 222 C146 220 174 242 179 276Z" fill="url(#lf)"/><path d="M176 272 Q145 252 120 228" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" fill="none"/></g>

        <!-- flower -->
        <g class="flower-hit" id="flower" tabindex="-1" role="button" aria-label="Tap the flower" style="pointer-events:none">
          <g id="bloom" class="bloom-wrap">
            <circle class="center-glow" cx="180" cy="130" r="78" fill="url(#glw)"/>
            <g class="bud" id="bud" style="transform-origin:180px 196px;transform-box:view-box">
              <path class="petal p-back" d="M180 196 C142 188 130 130 150 92 C165 108 178 100 180 80 C182 100 195 108 210 92 C230 130 218 188 180 196Z" fill="url(#pg2)" style="transform-origin:180px 196px;transform-box:view-box"/>
              <path class="petal p-left" d="M180 196 C138 186 134 126 160 92 C182 118 192 160 180 196Z" fill="url(#pg)" style="transform-origin:180px 196px;transform-box:view-box"/>
              <path class="petal p-right" d="M180 196 C222 186 226 126 200 92 C178 118 168 160 180 196Z" fill="url(#pg)" style="transform-origin:180px 196px;transform-box:view-box"/>
              <path class="petal p-front" d="M180 198 C150 190 148 130 180 88 C212 130 210 190 180 198Z" fill="url(#pg2)" style="transform-origin:180px 196px;transform-box:view-box"/>
              <path d="M180 100 Q172 150 180 190" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/>
              <path d="M168 192 Q180 204 192 192 L186 204 Q180 208 174 204Z" fill="#8fd09a"/>
            </g>
          </g>
        </g>
      </g>
      <g id="sprout" style="opacity:0;transition:opacity .6s"></g>
    </svg>
    <div class="hearts" id="hearts" aria-hidden="true"></div>
  </div>

  <section class="bottom" aria-live="polite">
    <p class="msg" id="msg"></p>
    <p class="msg2" id="msg2"></p>
    <p class="secret" id="secret"></p>
    <button class="btn" id="growBtn" type="button">Grow a flower 💗</button>
    <button class="btn" id="keepBtn" type="button" hidden>Keep the flower 💗</button>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var scene=$('scene'),stage=$('stage'),hearts=$('hearts'),msg=$('msg'),msg2=$('msg2'),secret=$('secret');
  var growBtn=$('growBtn'),keepBtn=$('keepBtn'),flower=$('flower'),title=$('title');
  var timers=[],taps=0,bloomed=false,kept=false,secretShown=false;
  function wait(ms){return new Promise(function(r){timers.push(setTimeout(r,reduce?Math.min(ms,60):ms))})}

  // twinkles (few, cheap)
  for(var i=0;i<7;i++){var d=document.createElement('span');d.className='dust';
    d.style.left=(8+Math.random()*84)+'%';d.style.top=(6+Math.random()*60)+'%';
    d.style.animationDelay=(Math.random()*3)+'s';stage.appendChild(d);}

  function heart(){
    if(hearts.children.length>9)return;
    var h=document.createElement('span');h.className='heart';
    h.textContent=['💗','💕','🌸','✨'][Math.floor(Math.random()*4)];
    h.style.left=(30+Math.random()*40)+'%';h.style.setProperty('--dx',(Math.random()*80-40)+'px');
    h.style.fontSize=(11+Math.random()*9)+'px';
    hearts.appendChild(h);setTimeout(function(){h.remove()},4200);
  }
  function burst(n){for(var i=0;i<n;i++)setTimeout(heart,i*260)}

  function type(el,text,speed){
    return new Promise(function(res){
      if(reduce){el.textContent=text;return res()}
      el.textContent='';var i=0;
      (function step(){el.textContent=text.slice(0,++i);
        if(i<text.length)timers.push(setTimeout(step,speed||38));else res()})();
    });
  }

  async function grow(){
    growBtn.hidden=true;
    title.textContent='Here we go… 🌱';
    $('seed').classList.add('wiggle');                       // 1 seed wiggles
    await wait(1000);
    title.textContent='A Little Flower For You 🌷';
    scene.classList.add('grow');                             // 2-3 sprout + stem
    await wait(1400);
    $('seed').style.transition='opacity .8s';$('seed').style.opacity='0';
    await wait(1100);
    $('leaf1').classList.add('on');                          // 4 leaves one by one
    await wait(900);
    $('leaf2').classList.add('on');
    await wait(1000);
    $('bud').classList.add('on');                            // 5 bud
    await wait(1500);
    scene.classList.add('open');                             // 6-7 bloom
    await wait(2800);
    bloomed=true;
    flower.style.pointerEvents='auto';flower.setAttribute('tabindex','0');
    burst(5);                                                 // 8 hearts
    var hb=setInterval(function(){if(!reduce)heart()},2600);timers.push(hb);
    await type(msg,"I made you a flower because I couldn't exactly hand-code you one in real life. 🌷",34);
    await wait(500);
    msg2.textContent='But I hope this one still makes you smile. :)';msg2.classList.add('on');
    await wait(1200);
    keepBtn.hidden=false;keepBtn.classList.add('fade-in');
  }

  function keep(){
    if(kept)return;kept=true;
    keepBtn.hidden=true;scene.classList.add('swaying');
    burst(7);
    msg2.classList.remove('on');
    msg.textContent='Okay, you can keep it. I made it just for you anyway. 💕';
    msg.classList.remove('fade-in');void msg.offsetWidth;msg.classList.add('fade-in');
  }

  function poke(){
    if(!bloomed||secretShown)return;
    taps++;
    var b=$('bloom');b.classList.remove('poke');void b.getBoundingClientRect();b.classList.add('poke');
    heart();
    if(taps>=3){
      secretShown=true;
      secret.textContent="Psst... I think you're pretty cute too. 👀💗";
      secret.classList.add('fade-in');burst(6);
    }
  }

  growBtn.addEventListener('click',grow);
  keepBtn.addEventListener('click',keep);
  flower.addEventListener('click',poke);
  flower.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});
})();
</script>
</body>
</html>
